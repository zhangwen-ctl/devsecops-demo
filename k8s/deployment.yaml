apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo
  labels:
    app: devsecops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsecops-demo
  template:
    metadata:
      labels:
        app: devsecops-demo
    spec:
      containers:
        - name: devsecops-demo
          image: registry.dfl.com.cn/devops/github/devsecops-demo@sha256:826afca9b30335f899f938655ebdc9250dbe67b15547f11e0c9724f4fcde60de
          env:
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: payment-api-secret
                key: DB_USERNAME
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: payment-api-secret
                key: DB_PASSWORD
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
