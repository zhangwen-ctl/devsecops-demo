name: GitHub DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write          # 必须 write，否则最后 git push 会 403

env:
  IMAGE_NAME: registry.dfl.com.cn/devops/github/devsecops-demo
  PUBLISH_IMAGE: ${{ secrets.PUBLISH_IMAGE }}
  GITOPS_MANIFEST_PATH: k8s/deployment.yaml

jobs:
  test-and-build:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # git push 需要完整历史

      - name: Verify self-hosted runner
        run: |
          echo "Runner host: $(hostname -f)"
          echo "Runner labels: ${RUNNER_LABELS}"
          echo "OS: $(. /etc/os-release && echo "${PRETTY_NAME}")"
          docker version --format 'Docker server: {{.Server.Version}}'

      - name: Unit tests
        run: python3 -m unittest discover -v

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" .

      - name: Login to image registry
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          REGISTRY_HOST="${IMAGE_NAME%%/*}"
          printf '%s' "${DOCKER_PASSWORD}" | docker login "${REGISTRY_HOST}" \
            --username "${DOCKER_USERNAME}" --password-stdin

      - name: Push image and resolve immutable digest
        id: image
        run: |
          IMAGE_TAG="${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          docker push "${IMAGE_TAG}"

          # RepoDigests is populated from the registry's manifest response.
          DIGEST=$(docker image inspect "${IMAGE_TAG}" \
            --format '{{index .RepoDigests 0}}' \
            | awk -F@ '{print $2}')

          if [ -z "${DIGEST}" ] || ! printf '%s' "${DIGEST}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::无法获取或校验镜像 Manifest Digest"
            exit 1
          fi

          echo "image=${IMAGE_NAME}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      # ==================== GitOps 更新 ====================

      - name: Sanity check manifest
        run: |
          echo "pwd=$(pwd)"
          echo "=== k8s 目录 ==="
          ls -la k8s/
          echo "=== 当前 image 字段 ==="
          grep -n "image:" "${GITOPS_MANIFEST_PATH}" \
            || { echo "::error::${GITOPS_MANIFEST_PATH} 里找不到 image:"; exit 1; }

      - name: Update GitOps manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NEW_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if ! printf '%s' "${NEW_IMAGE}" | grep -Eq "^${IMAGE_NAME}@sha256:[0-9a-f]{64}$"; then
            echo "::error::镜像 Digest 格式无效: ${NEW_IMAGE}"
            exit 1
          fi

          echo "更新 GitOps 为不可变 Digest: ${NEW_IMAGE}"
          echo "=== 替换前 ==="
          grep -n "image:" "${GITOPS_MANIFEST_PATH}"

          # 同时匹配旧 Tag 与旧 Digest 引用，保持清单只引用 repository@sha256:...。
          sed -i -E "s#${IMAGE_NAME}(@sha256:[0-9a-f]{64}|:[^[:space:]]+)#${NEW_IMAGE}#g" \
            "${GITOPS_MANIFEST_PATH}"

          echo "=== 替换后 ==="
          grep -n "image:" "${GITOPS_MANIFEST_PATH}"
          grep -Eq "${IMAGE_NAME}@sha256:[0-9a-f]{64}" "${GITOPS_MANIFEST_PATH}" \
            || { echo "::error::清单未写入不可变 Digest"; exit 1; }

          echo "=== git diff ==="
          git --no-pager diff "${GITOPS_MANIFEST_PATH}"

      - name: Commit and push GitOps change
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${GITOPS_MANIFEST_PATH}"

          if git diff --cached --quiet; then
            echo "清单无变更，跳过提交"
            exit 0
          fi

          git commit -m "chore(gitops): update image to ${GITHUB_RUN_NUMBER} [skip ci]"
          git push
