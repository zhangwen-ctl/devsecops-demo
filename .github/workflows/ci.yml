name: GitHub DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write          # 必须 write，否则最后 git push 会 403

env:
  IMAGE_NAME: registry.dfl.com.cn/devops/github/devsecops-demo
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  PUBLISH_IMAGE: ${{ secrets.PUBLISH_IMAGE }}
  GITOPS_MANIFEST_PATH: k8s/deployment.yaml

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # git push 需要完整历史

      - name: Verify self-hosted runner
        run: |
          echo "Runner host: $(hostname -f)"
          echo "Runner labels: ${RUNNER_LABELS}"
          echo "OS: $(. /etc/os-release && echo "${PRETTY_NAME}")"
          docker version --format 'Docker server: {{.Server.Version}}'

      - name: Unit tests
        run: python3 -m unittest discover -v

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" .

      - name: Push image
        run: docker push "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"

      # ==================== GitOps 更新 ====================

      - name: Sanity check manifest
        run: |
          echo "pwd=$(pwd)"
          echo "=== k8s 目录 ==="
          ls -la k8s/
          echo "=== 当前 image 字段 ==="
          grep -n "image:" "${GITOPS_MANIFEST_PATH}" \
            || { echo "::error::${GITOPS_MANIFEST_PATH} 里找不到 image:"; exit 1; }

      - name: Update GitOps manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          NEW_IMAGE="${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
          echo "NEW_IMAGE=${NEW_IMAGE}"

          echo "=== 替换前 ==="
          grep -n "image:" "${GITOPS_MANIFEST_PATH}"

          # 用 | 作分隔符，避开 IMAGE_NAME 里的 /
          sed -i "s|${IMAGE_NAME}:[^[:space:]]*|${NEW_IMAGE}|g" \
            "${GITOPS_MANIFEST_PATH}"

          echo "=== 替换后 ==="
          grep -n "image:" "${GITOPS_MANIFEST_PATH}"
          echo "=== git diff ==="
          git --no-pager diff "${GITOPS_MANIFEST_PATH}"

      - name: Commit and push GitOps change
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${GITOPS_MANIFEST_PATH}"

          if git diff --cached --quiet; then
            echo "清单无变更，跳过提交"
            exit 0
          fi

          git commit -m "chore(gitops): update image to ${GITHUB_RUN_NUMBER} [skip ci]"
          git push
