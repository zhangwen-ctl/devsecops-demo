name: GitHub DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: registry.dfl.com.cn/devops/github/devsecops-demo
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  PUBLISH_IMAGE: ${{ secrets.PUBLISH_IMAGE }}
  GITOPS_MANIFEST_PATH: k8s/deployment.yaml          # 根据项目实际路径修改

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                              # 需要完整历史来推送

      - name: Verify self-hosted runner
        run: |
          echo "Runner host: $(hostname -f)"
          echo "Runner labels: ${RUNNER_LABELS}"
          echo "OS: $(. /etc/os-release && echo "${PRETTY_NAME}")"
          docker version --format 'Docker server: {{.Server.Version}}'

      - name: Unit tests
        run: python3 -m unittest discover -v

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" .

      - name: Push image
        run: docker push "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"

      # ========== 新增步骤：更新 GitOps 清单 ==========
      - name: Install yq
        run: |
          if ! command -v yq &> /dev/null; then
            sudo wget -qO /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Update GitOps manifest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          NEW_TAG="${GITHUB_RUN_NUMBER}"
          MANIFEST="${GITOPS_MANIFEST_PATH}"

          # 使用 yq 更新 Deployment 中的镜像标签
          yq -i "
            (.spec.template.spec.containers[] | select(.name == \"devsecops-demo\") | .image) =
            \"${IMAGE_NAME}:${NEW_TAG}\"" "${MANIFEST}"

          echo "=== 变更对比 ==="
          git diff "${MANIFEST}" || true

      - name: Commit and push GitOps change
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${GITOPS_MANIFEST_PATH}"

          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore(gitops): update image tag to ${GITHUB_RUN_NUMBER} [skip ci]"
            git push
          fi
