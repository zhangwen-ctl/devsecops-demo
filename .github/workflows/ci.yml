name: GitHub DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: registry.dfl.com.cn/devsecops/github/devsecops-demo
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  PUBLISH_IMAGE: ${{ secrets.PUBLISH_IMAGE }}

jobs:
  test-and-build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify self-hosted runner
        run: |
          echo "Runner host: $(hostname -f)"
          echo "Runner labels: ${RUNNER_LABELS}"
          echo "OS: $(. /etc/os-release && echo "${PRETTY_NAME}")"
          docker version --format 'Docker server: {{.Server.Version}}'

      - name: Unit tests
        run: python3 -m unittest discover -v

      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          sonar-scanner \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}"

      - name: Build image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}" .

      - name: Push image
        if: ${{ env.PUBLISH_IMAGE == 'true' }}
        run: docker push "${IMAGE_NAME}:${GITHUB_RUN_NUMBER}"
